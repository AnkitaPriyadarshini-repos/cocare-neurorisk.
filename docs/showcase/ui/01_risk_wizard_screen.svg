<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 880" width="700" height="880" style="background:#fdf8f0; font-family:'Noto Sans Oriya', 'Kalinga', 'Segoe UI', system-ui, sans-serif;">
  <!-- Header / Top Bar -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="100" height="42" rx="10" fill="#ffffff" stroke="#d8cfc2" stroke-width="2"/>
    <text x="50" y="26" text-anchor="middle" font-size="16" fill="#1d1d1b" font-weight="600">← ପଛକୁ</text>

    <!-- Font Size Controls -->
    <rect x="440" y="0" width="120" height="42" rx="10" fill="#ece6dc" stroke="#d8cfc2" stroke-width="1"/>
    <text x="462" y="27" text-anchor="middle" font-size="16" fill="#1d1d1b">A</text>
    <rect x="480" y="4" width="38" height="34" rx="8" fill="#ffffff" stroke="#d8cfc2" stroke-width="2"/>
    <text x="499" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#b4471b">A+</text>
    <text x="540" y="29" text-anchor="middle" font-size="21" font-weight="bold" fill="#1d1d1b">A++</text>

    <text x="630" y="27" text-anchor="end" font-size="15" fill="#5a5650">✕ ବନ୍ଦ କରନ୍ତୁ</text>
  </g>

  <!-- Title & Step progress -->
  <g transform="translate(30, 95)">
    <text x="0" y="24" font-size="26" font-weight="bold" fill="#1d1d1b">🩺 ସ୍ୱାସ୍ଥ୍ୟ ଯାଞ୍ଚ (Risk Check)</text>
    <text x="640" y="24" text-anchor="end" font-size="17" font-weight="600" fill="#5a5650">ପଦକ୍ଷେପ ୧ / ୫ (Step 1 of 5)</text>

    <!-- Progress track & fill -->
    <rect x="0" y="40" width="640" height="12" rx="6" fill="#e6ded3"/>
    <rect x="0" y="40" width="128" height="12" rx="6" fill="#b4471b"/>
  </g>

  <!-- Question Card -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="640" height="480" rx="18" fill="#ffffff" stroke="#d8cfc2" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.03))"/>

    <!-- Question Title -->
    <text x="32" y="52" font-size="24" font-weight="bold" fill="#1d1d1b">ବୟସ (ବର୍ଷ) · Age (years)</text>

    <!-- Audio Read Button -->
    <rect x="470" y="24" width="140" height="44" rx="12" fill="#faf8f5" stroke="#d8cfc2" stroke-width="2"/>
    <text x="540" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d1d1b">🔊 ଶୁଣନ୍ତୁ (Listen)</text>

    <!-- Help Text -->
    <text x="32" y="95" font-size="17" fill="#5a5650">ଅଂଶଗ୍ରହଣକାରୀଙ୍କ ସମ୍ପୂର୍ଣ୍ଣ ବୟସ (୪୦-୧୨୦) [needs native review]</text>
    <text x="32" y="125" font-size="15" fill="#777777" font-style="italic">Participant age in complete years (40-120).</text>

    <!-- Stepper Controls -->
    <g transform="translate(100, 190)">
      <!-- Minus -->
      <rect x="0" y="0" width="90" height="90" rx="16" fill="#ffffff" stroke="#d8cfc2" stroke-width="3"/>
      <text x="45" y="58" text-anchor="middle" font-size="44" font-weight="bold" fill="#1d1d1b">−</text>

      <!-- Value Box -->
      <rect x="120" y="0" width="200" height="90" rx="16" fill="#fdf8f0" stroke="#b4471b" stroke-width="3"/>
      <text x="220" y="60" text-anchor="middle" font-size="44" font-weight="bold" fill="#1d1d1b">65</text>
      <text x="220" y="115" text-anchor="middle" font-size="16" fill="#5a5650">ବର୍ଷ (years)</text>

      <!-- Plus -->
      <rect x="350" y="0" width="90" height="90" rx="16" fill="#ffffff" stroke="#d8cfc2" stroke-width="3"/>
      <text x="395" y="58" text-anchor="middle" font-size="44" font-weight="bold" fill="#1d1d1b">+</text>
    </g>

    <!-- Range Hint -->
    <text x="320" y="375" text-anchor="middle" font-size="15" fill="#777777">ଅନୁମୋଦିତ ସୀମା: ୪୦ ରୁ ୧୨୦ ବର୍ଷ (Permitted: 40 to 120)</text>
  </g>

  <!-- Next Button -->
  <g transform="translate(30, 690)">
    <rect x="0" y="0" width="640" height="76" rx="16" fill="#b4471b"/>
    <text x="320" y="47" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">ଆଗକୁ (Next) →</text>
  </g>

  <!-- Footer Notice -->
  <text x="350" y="810" text-anchor="middle" font-size="14" fill="#777777">
    Elderly-friendly touch targets (min 56px) · Zero server-side data retention
  </text>
</svg>