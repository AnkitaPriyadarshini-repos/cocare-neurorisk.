<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1020" width="700" height="1020" style="background:#fdf8f0; font-family:'Noto Sans Oriya', 'Kalinga', 'Segoe UI', system-ui, sans-serif;">
  <!-- Header -->
  <g transform="translate(30, 30)">
    <text x="0" y="28" font-size="26" font-weight="bold" fill="#1d1d1b">🩺 ଆପଣଙ୍କ ସ୍କ୍ରିନିଂ ସାରାଂଶ</text>
    <rect x="490" y="0" width="150" height="44" rx="12" fill="#ffffff" stroke="#d8cfc2" stroke-width="2"/>
    <text x="565" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d1d1b">🔊 ଶୁଣନ୍ତୁ (Listen)</text>
  </g>

  <!-- Main Card -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="640" height="540" rx="18" fill="#ffffff" stroke="#d8cfc2" stroke-width="3" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.05))"/>

    <!-- Score Label & Value -->
    <text x="32" y="48" font-size="16" fill="#5a5650">ମଡେଲ ସ୍କୋର (Model Score, Calibrated)</text>
    <text x="32" y="105" font-size="48" font-weight="800" fill="#1d1d1b">0.2854</text>

    <!-- Score Band Badge -->
    <g transform="translate(360, 48)">
      <rect x="0" y="0" width="245" height="58" rx="14" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2"/>
      <text x="25" y="38" font-size="28">🛡️</text>
      <text x="65" y="37" font-size="18" font-weight="bold" fill="#1b5e20">ନିମ୍ନ ସତର୍କତା ସ୍ତର</text>
    </g>

    <!-- Calibration Note -->
    <rect x="32" y="130" width="576" height="42" rx="10" fill="#f9f6f0" stroke="#e0d7cb"/>
    <text x="48" y="156" font-size="14" fill="#5a5650">ℹ️ Model score calibrated to OASIS sample prevalence of 48.5% (Threshold: 0.3301)</text>

    <!-- What to do next -->
    <line x1="32" y1="195" x2="608" y2="195" stroke="#d8cfc2" stroke-dasharray="6 6" stroke-width="2"/>
    <text x="32" y="232" font-size="20" font-weight="bold" fill="#1d1d1b">🧭 ପରବର୍ତ୍ତୀ ପଦକ୍ଷେପ (What to do next)</text>
    <text x="32" y="265" font-size="16" fill="#1d1d1b">ନିୟମିତ ମନୋରଞ୍ଜକ ଖେଳ ଖେଳନ୍ତୁ, ସାଙ୍ଗସାଥୀଙ୍କ ସହ ସମୟ ବିତାନ୍ତୁ ଏବଂ ଶାରୀରିକ ବ୍ୟାୟାମ ଜାରି ରଖନ୍ତୁ।</text>
    <text x="32" y="292" font-size="15" fill="#5a5650" font-style="italic">Continue healthy habits: stay mentally active, socially connected, and physically moving.</text>

    <!-- Factors section -->
    <line x1="32" y1="325" x2="608" y2="325" stroke="#eee" stroke-width="1.5"/>
    <text x="32" y="355" font-size="17" font-weight="bold" fill="#5a5650">🔍 ସ୍କୋର ଉପରେ କାରକଗୁଡ଼ିକର ପ୍ରଭାବ (|magnitude| ≥ 0.01):</text>
    <text x="45" y="388" font-size="15" fill="#1d1d1b">• 📉 <tspan font-weight="bold">EDUC (14 years):</tspan> Lowered score by 0.032 relative to typical training-data values</text>
    <text x="45" y="416" font-size="15" fill="#1d1d1b">• 📉 <tspan font-weight="bold">Sex (Female):</tspan> Lowered score by 0.018 relative to typical training-data values</text>

    <!-- Clinical Disclaimer Banner -->
    <g transform="translate(32, 445)">
      <rect x="0" y="0" width="576" height="70" rx="12" fill="#fff3e0" stroke="#ffe082" stroke-width="2"/>
      <text x="18" y="28" font-size="15" font-weight="bold" fill="#b4471b">⚠️ ସୂଚନା: ଏହା କେବଳ ଏକ ପ୍ରାଥମିକ ସ୍କ୍ରିନିଂ, କୌଣସି ଡାକ୍ତରୀ ରୋଗ ନିର୍ଣ୍ଣୟ ନୁହେଁ।</text>
      <text x="18" y="52" font-size="13" fill="#795548">OASIS ଗବେଷଣା ଡେମୋ · ଭାରତୀୟ ଜନସଂଖ୍ୟା (LASI-DAD) ପାଇଁ ପରୀକ୍ଷିତ ନୁହେଁ · Please consult a physician.</text>
    </g>
  </g>

  <!-- Doctor Summary & Opt-in -->
  <g transform="translate(30, 655)">
    <!-- Doctor Summary Button -->
    <rect x="0" y="0" width="640" height="66" rx="14" fill="#ffffff" stroke="#b4471b" stroke-width="2"/>
    <text x="320" y="41" text-anchor="middle" font-size="18" font-weight="bold" fill="#b4471b">📄 ଡାକ୍ତରଙ୍କ ପାଇଁ ସାରାଂଶ (Print Doctor Summary)</text>

    <!-- Opt-in Checkbox Card -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="640" height="90" rx="14" fill="#ffffff" stroke="#d8cfc2" stroke-width="2"/>
      <rect x="25" y="25" width="34" height="34" rx="8" fill="#b4471b"/>
      <text x="42" y="49" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">✓</text>
      <text x="75" y="38" font-size="16" font-weight="bold" fill="#1d1d1b">ଫଳାଫଳକୁ ଏହି ଫୋନରେ ରଖନ୍ତୁ (Save to this device)</text>
      <text x="75" y="60" font-size="14" fill="#5a5650">କେବଳ ଏହି ଫୋନରେ ରହିବ, ସର୍ଭରକୁ ଯିବ ନାହିଁ। Purely local &amp; private on-device storage.</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="640" height="72" rx="16" fill="#b4471b"/>
      <text x="320" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">📈 ମୋର ପ୍ରଗତି ଦେଖନ୍ତୁ (View My Progress)</text>
    </g>
  </g>
</svg>