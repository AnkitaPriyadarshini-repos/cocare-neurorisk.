name: ML & Backend CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, ml/part-a, ml/part-a-validation ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx pandas scikit-learn==1.6.1 joblib

      - name: Run existing backend tests
        run: |
          cd backend
          python -m pytest tests/test_api.py -v

      - name: Run risk screening backend tests
        run: |
          cd backend
          python -m pytest tests/test_risk.py -v

      - name: Run ML pipeline unit tests
        run: |
          python -m pytest ml/tests/test_pipeline.py -v

      - name: Verify schema consistency (form_spec.json matches model metadata)
        run: |
          python -c "
          import json
          with open('backend/models/form_spec.json') as f:
              form_spec = json.load(f)
          with open('backend/models/model_with_mmse_metadata.json') as f:
              meta_with = json.load(f)
          with open('backend/models/model_without_mmse_metadata.json') as f:
              meta_without = json.load(f)
          form_fields = {f['name'] for f in form_spec['fields']}
          with_fields = set(meta_with['features']['all_ordered'])
          without_fields = set(meta_without['features']['all_ordered'])
          assert with_fields.issubset(form_fields), f'Mismatch: {with_fields - form_fields} missing from form_spec'
          assert without_fields.issubset(form_fields), f'Mismatch: {without_fields - form_fields} missing from form_spec'
          assert 'MMSE' not in without_fields, 'Leakage: MMSE present in without_mmse model!'
          print('Schema consistency check passed: form_spec.json perfectly aligns with model metadata.')
          "

      - name: Verify no raw participant data files are committed
        run: |
          if git ls-files | grep -E '\.(dta|sav)$'; then
            echo "Error: Participant-level clinical data files (.dta / .sav) found in repository!"
            exit 1
          fi
          if git ls-files | grep -E '^ml/data/.*\.csv$'; then
            echo "Error: Raw CSV data files found under ml/data/!"
            exit 1
          fi
          echo "Data privacy check passed: no raw participant records committed."
